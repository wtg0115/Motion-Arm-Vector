  if(qMed<WRIST_FRAME_MIN_REGISTER){setStatus(`🔴 등록 거부 — 손목 기준축 ${Math.round(qMed*100)}%. 전완을 더 눕혀 수직을 피하세요`);return;}
  if(hqMed<DIAG_HAND_QUALITY_MIN){setStatus(`🔴 등록 거부 — 손 품질 ${Math.round(hqMed*100)}%. 손목과 MCP 3점이 모두 보이게`);return;}
  // 오른팔 CH0는 고정 0°를 요구하지 않는다. 지금 수집한 음수 중앙값 자체가 STOW 기준이다.
  if(RIGHT_ARM_CH0_EXPECT_NEGATIVE&&med[0]>20){
    setStatus(`🔴 오른팔 CH0가 양수 ${med[0].toFixed(1)}° — 팔 선택/몸통 방향이 뒤집혔을 가능성. 오른팔 고정 상태를 확인하세요`);
    return;
  }
  const humanDiff=[0,Math.abs(med[1]-RIGHT_ARM_REFERENCE_RAW[1]),Math.abs(med[2]-RIGHT_ARM_REFERENCE_RAW[2]),0,0];
  const humanBad=[1,2].find(i=>humanDiff[i]>RIGHT_ARM_REFERENCE_TOL[i]);
  if(humanBad!=null){
    setStatus(`🔴 오른팔 통합자세 불일치 — CH${humanBad} 편차 ${humanDiff[humanBad].toFixed(1)}°. 현재 raw [${med.map(v=>v.toFixed(1)).join(', ')}], 목표 ${UNIFIED_POSE_TEXT}`);
    return;
  }
  const servoAtPose=[
    ROBOT_STOW_POSE[0],directHumanToServoUnclamped(med[1],1),directHumanToServoUnclamped(med[2],2),
    directHumanToServoUnclamped(0,3),ROBOT_STOW_POSE[4]
  ];
  const diff=servoAtPose.map((v,i)=>Math.abs(v-ROBOT_STOW_POSE[i]));
  const bad=diff.findIndex((d,i)=>d>UNIFIED_START_SERVO_TOL[i]);
  if(bad>=0){
    setStatus(`🔴 로봇 STOW 정합 실패 — CH${bad} 차이 ${diff[bad].toFixed(1)}°. 현재 raw [${med.map(v=>v.toFixed(1)).join(', ')}]`);
    return;
  }
  const qAvg=averageQuaternions(samples.map(s=>s.quat));
  if(!setWristReferenceQuat(qAvg)){setStatus('손목 기준 쿼터니언 평균 저장 실패');return;}
  refPose=[med[0],med[1],med[2],0,0];calibRef=null;sysState='idle';matchHoldStart=0;
  resetCommandSafety(ROBOT_STOW_POSE);
  try{localStorage.setItem(REFPOSE_STORAGE_KEY,JSON.stringify({version:'v10.1-right-arm-baseline',arm:'right',raw:refPose}));}catch(e){}
  $btnCalib.textContent='📍 오른팔 기준 등록됨';$btnCalib.classList.add('on');
  setStatus(`✅ 오른팔 기준값 수집 완료 — CH0 ${refPose[0].toFixed(1)}°를 로봇 140° 기준으로 사용 · raw [${refPose.map(v=>v.toFixed(1)).join(', ')}]`);
};

// ── 시동 트리거: idle → arming ──
function armSystem(){
  if(!hardwareConfigValid()){
    setStatus("🔒 하드웨어 보정이 끝나지 않아 실제 로봇 시동이 차단되어 있습니다");
    return;
  }
  if(romActive){
    setStatus("물리 5축 ROM·혼입 측정 중에는 로봇을 시동할 수 없습니다");
    setTimeout(()=>{$status.style.opacity=0;},1800); return;
  }
  if(!refPose){
    setStatus("먼저 '기준 자세'를 등록하세요 (📍 버튼)");
    setTimeout(()=>{$status.style.opacity=0;},2000); return;
  }
  if(!robotConnected){
    setStatus("먼저 로봇을 연결하세요 (🤖 버튼)");return;
  }
  if(!robotPwmEnabled){
    setStatus("PWM이 OFF입니다 — ⚡ PWM 켜기를 2단 확인하세요");return;
  }
  sysState='arming';
  matchHoldStart=0;
  setStatus(`🎯 시동 준비 — ${UNIFIED_POSE_TEXT}. 0.8초 유지하면 추적 시작 (첫 실기 제한모드)`);
}
// ── 대기 트리거: active/arming → idle ──
function disarmSystem(){
  sysState='idle';
  matchHoldStart=0;
  setStatus("⏸ 대기 — 0.9초 홀드 → 5초 STOW 복귀 → 약 15초 PWM 자동 OFF");
  setTimeout(()=>{$status.style.opacity=0;},1800);
}
// [v10.4] 즉시 동기화 시동: 지금 자세를 기준으로 등록하고 바로 추적. 자세일치 대기 없음.
//   절대각(CH0~2)이라 아무 자세나 OK. 손바닥만 화면을 향하면(손목 인식) 된다.
function instantArm(){
  if(!hardwareConfigValid()){setStatus("🔒 하드웨어 보정 미완 — 시동 차단");return;}
  if(romActive){setStatus("측정 중에는 시동할 수 없습니다");return;}
  if(!running){setStatus("먼저 카메라를 시작하세요");return;}
  if(!robotConnected){setStatus("먼저 로봇을 연결하세요 (🤖)");return;}
  if(!robotPwmEnabled){setStatus("PWM이 OFF입니다 — ⚡ PWM 켜기 먼저");return;}
  if(!lastRawAngles.slice(0,3).every(Number.isFinite)){setStatus("🔴 팔 인식이 불안정 — 상체가 다 보이게 하고 다시");return;}
  if((lastHandQuality??0)<DIAG_HAND_QUALITY_MIN||(lastWristFrameQuality??0)<WRIST_FRAME_MIN_REGISTER){
    setStatus("🔴 손목/손 인식 불안정 — 손바닥이 화면을 향하게 하고 다시");return;
  }
  if(!setWristReferenceFromCurrent()){setStatus("손목 기준 저장 실패 — 손이 잘 보이게 다시");return;}
  refPose=[lastRawAngles[0],lastRawAngles[1],lastRawAngles[2],0,0];
  calibRef=[...refPose];
  try{localStorage.setItem(REFPOSE_STORAGE_KEY,JSON.stringify({version:'v10.1-right-arm-baseline',arm:'right',raw:refPose}));}catch(e){}
  $btnCalib.textContent='📍 오른팔 기준 등록됨';$btnCalib.classList.add('on');
  resetCommandSafety(ROBOT_STOW_POSE);
  sysState='active';matchHoldStart=0;
  setStatus('✅ 즉시 동기화 + 시동! 지금 이 자세를 기준으로 팔을 따라갑니다');
  setTimeout(()=>{$status.style.opacity=0;},1800);
}
// 상태 토글 (시동 트리거 키/박수가 부름)
function toggleArm(){
  if(sysState!=='idle'){ disarmSystem(); return; }  // arming/active면 대기로
  if(triggerMode==='instant') instantArm();          // 즉시 동기화+시동
  else armSystem();                                   // wrist/full = 자세일치 대기
}

$btnLock.onclick=()=>{
  if(personLocked){
    // 락 해제
    personLocked=false;
    lockSig=null;
    lockLostFrames=0;
    $btnLock.textContent="🔒 인물 고정";
    $btnLock.classList.remove("on");
    setStatus("인물 고정 해제 — 가장 가까운 사람 자동 추적");
    setTimeout(()=>{$status.style.opacity=0;},1200);
  } else {
    // 지금 추적 중인 사람을 락. 현재 프레임에서 지문 추출
    if(!lastPose||!lastPose.landmarks||lastPose.landmarks.length===0){
      setStatus("고정할 사람이 없어 — 먼저 화면에 들어와");
      setTimeout(()=>{$status.style.opacity=0;},1500);
      return;
    }
    // 락 걸기 직전엔 아직 personLocked=false라 choosePersonIndex가 '제일 가까운 사람' 반환
    const idx=choosePersonIndex(lastPose);
    if(idx<0){ setStatus("사람 인식 실패 — 다시 시도"); return; }
    const sig=personSignature(lastPose.landmarks[idx]);
    if(!sig){ setStatus("어깨가 안 보여 — 상체가 다 나오게"); return; }
    lockSig={...sig};
    personLocked=true;
    lockLostFrames=0;
    $btnLock.textContent="🔓 고정 중";
    $btnLock.classList.add("on");
    setStatus("이 사람에게 고정됨 — 타인이 들어와도 유지");
    setTimeout(()=>{$status.style.opacity=0;},1500);
  }
};

const $btnTrigMode=document.getElementById("btnTrigMode");
$btnTrigMode.textContent=TRIGGER_LABEL[triggerMode];
$btnTrigMode.onclick=()=>{
  const i=(TRIGGER_MODES.indexOf(triggerMode)+1)%TRIGGER_MODES.length;
  triggerMode=TRIGGER_MODES[i];
  $btnTrigMode.textContent=TRIGGER_LABEL[triggerMode];
  const hint={instant:'엔터 누른 순간 현재 자세로 즉시 동기화+시동 (대기·자세일치 없음)',
              wrist:'손목(손바닥 방향)만 맞으면 시동 — 몸통은 아무 자세나 OK',
              full:'5축 전체 자세가 맞아야 시동 (가장 엄격)'}[triggerMode];
  setStatus('🎛 '+TRIGGER_LABEL[triggerMode]+' — '+hint);
  setTimeout(()=>{$status.style.opacity=0;},2400);
};

if(refPose&&wristReferenceQuat){$btnCalib.textContent='📍 오른팔 기준 등록됨';$btnCalib.classList.add('on');}
updateRobotButtons();

if(!window.isSecureContext){
  $status.textContent=`⚠ 이 주소(${location.protocol})에선 카메라 API가 잠겨 있어. HTTPS 또는 localhost로 열어야 함.`;
}
let resizeTimer=null;
window.addEventListener("resize",()=>{
  if(!running) return;
  clearTimeout(resizeTimer); resizeTimer=setTimeout(resizeCanvases,150);
});

// 키보드 단축키: Space=시작/진단캡처, B=진단 재촬영, S=진단 건너뛰기,
//                G=가동범위 단계완료, L=인물고정, M=반전, A=팔전환, Q=모델, R=자세등록, Enter=시동/대기
window.addEventListener("keydown",(e)=>{
  if(e.repeat) return;
  const k=e.key.toLowerCase();
  if(k===" "){
    e.preventDefault();
    if(diagActive){ diagCaptureStart(); }         // 진단 중이면 캡처
    else if(!$btnStart.disabled){ $btnStart.click(); }  // 아니면 시작
  }
  else if(k==="l") $btnLock.click();
  else if(k==="m") $btnMirror.click();
  else if(k==="a") $btnArm.click();
  else if(k==="q") $btnQuality.click();
  else if(k==="r") $btnCalib.click();  // R = 기준자세 등록(Register)
  else if(k==="g") $btnRom.click();      // G = 최고 가동범위 측정
  else if(k==="enter"){ e.preventDefault(); toggleArm(); }  // 엔터 = 시동/대기
  else if(k==="s" && diagActive){ diagSkip(); }        // 진단 중 S = 이 자세 건너뛰기
  else if(k==="b" && diagActive){ diagRetakePrev(); }  // 진단 중 B = 이전 자세로 되돌아가 재촬영
});

// ── v9.7: 마우스 우클릭으로 진단 캡처 트리거 ──
// 스페이스바를 누르려면 팔이 키보드로 갔다가 자세로 돌아오며 위치가 틀어진다.
// 마우스를 '측정 안 하는 반대 손'에 들고 화면 위에서 우클릭하면
// 측정하는 팔은 전혀 안 움직이고 트리거만 걸려 자세 오차가 크게 준다.
// 화면(#stage) 위 우클릭만 가로채고, 나머지 UI 우클릭(텍스트 복사 등)은 건드리지 않는다.
$stage.addEventListener("contextmenu",(e)=>{
  if(diagActive){
    e.preventDefault();        // 진단 중일 때만 브라우저 기본 메뉴 차단
    if(!diagCapturing){        // 이미 캡처 중이면 무시(중복 방지)
      if(diagCancelPending()) return;  // 경고 자동진행 대기 중이면 그 대기만 취소
      diagCaptureStart();
    }
  }
  // 진단 중이 아니면 preventDefault 안 함 → 평소 우클릭 메뉴 정상
});
// 진단 자세 건너뛰기
function diagSkip(){
  if(!diagActive || diagCapturing) return;
  if(diagCancelPending()) return;   // 경고 대기 중이면 그 대기만 끊고, 이미 기록된 결과는 유지
  diagResults.push({ pose:DIAG_POSES[diagIdx].id, name:DIAG_POSES[diagIdx].name,
                     skipped:true });
  diagAdvance();
}
</script>
