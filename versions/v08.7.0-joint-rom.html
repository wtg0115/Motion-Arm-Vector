<!-- ============================================================
     워커 (클래식 — CommonJS 번들 eval)
============================================================ -->
<script type="text/js-worker" id="workerSrc">
let landmarker = null;
let kind = null;
let busy = false;
let lastTs = 0;

self.onmessage = async (e) => {
  const msg = e.data;

  if (msg.type === "init") {
    kind = msg.kind;
    try {
      const r = await fetch(msg.bundleUrl);
      if (!r.ok) throw new Error("번들 다운로드 실패 HTTP " + r.status);
      const code = await r.text();

      // CommonJS 번들(.cjs) → exports/module 주입해서 eval
      const moduleShim = { exports: {} };
      (new Function("exports", "module", "self", "globalThis", code))(
        moduleShim.exports, moduleShim, self, self
      );
      const lib = moduleShim.exports;
      if (!lib || !lib.FilesetResolver) {
        throw new Error("vision 객체를 못 찾음 (번들 구조 변경 가능성)");
      }
      const { FilesetResolver, PoseLandmarker, HandLandmarker } = lib;
      const fileset = await FilesetResolver.forVisionTasks(msg.wasmRoot);

      async function build(delegate) {
        if (kind === "pose") {
          return await PoseLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: msg.modelUrl, delegate },
            runningMode: "VIDEO",
            numPoses: 3,
            minPoseDetectionConfidence: msg.opts.minDet,
            minPosePresenceConfidence: msg.opts.minPres,
            minTrackingConfidence: msg.opts.minTrack,
            outputSegmentationMasks: false
          });
        }
        return await HandLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: msg.modelUrl, delegate },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: msg.opts.minDet,
          minHandPresenceConfidence: msg.opts.minPres,
          minTrackingConfidence: msg.opts.minTrack
        });
      }

      try {
        landmarker = await build("GPU");
        self.postMessage({ type: "ready", kind, delegate: "GPU" });
      } catch (gpuErr) {
        landmarker = await build("CPU");
        self.postMessage({ type: "ready", kind, delegate: "CPU" });
      }
    } catch (err) {
      self.postMessage({ type: "error", kind, message: String(err && err.message || err) });
    }
    return;
  }

  if (msg.type === "frame" && landmarker && !busy) {
    busy = true;
    let bmp = msg.bitmap;
    try {
      let ts = msg.ts;
      if (ts <= lastTs) ts = lastTs + 1;
      lastTs = ts;

      const t0 = performance.now();
      const result = landmarker.detectForVideo(bmp, ts);
      const t1 = performance.now();

      self.postMessage({
        type: "result",
        kind,
        result: {
          landmarks: result.landmarks || [],
          worldLandmarks: result.worldLandmarks || [],
          handedness: result.handedness || result.handednesses || []
        },
        ms: t1 - t0
      });
    } catch (err) {
      self.postMessage({ type: "error", kind, message: String(err && err.message || err) });
    } finally {
      try { bmp && bmp.close && bmp.close(); } catch (e) {}
      busy = false;
    }
  }
};
</script>

<script type="module">
// ════════════════════════════════════════════════════════
// 설정 — 0.10.35 (최신 안정판), heavy 모델
// ════════════════════════════════════════════════════════
const VER = "0.10.35";
const WASM_ROOT  = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`;
const BUNDLE_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/vision_bundle.cjs`;

const POSE_MODELS = {
  heavy: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task",
  full:  "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"
};
const HAND_MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// 신뢰도 — 높을수록 헛검출↓, 안정↑ (노트북 고품질이라 약간 높게)
const CONF = { minDet: 0.6, minPres: 0.6, minTrack: 0.6 };

const POSE_IDX = { LSh:11, RSh:12, LElb:13, RElb:14, LWr:15, RWr:16, LHip:23, RHip:24 };
const HAND_IDX = { Wr:0, ThumbCmc:1, IndexMcp:5, MiddleMcp:9, RingMcp:13, PinkyMcp:17,
                   ThumbTip:4, IndexTip:8, MiddleTip:12, RingTip:16, PinkyTip:20 };
// 손가락 연결 (3D뷰용)
const HAND_BONES = [
  [0,1],[1,2],[2,3],[3,4],        // 엄지
  [0,5],[5,6],[6,7],[7,8],        // 검지
  [5,9],[9,10],[10,11],[11,12],   // 중지
  [9,13],[13,14],[14,15],[15,16], // 약지
  [13,17],[17,18],[18,19],[19,20],// 새끼
  [0,17]                          // 손바닥 아랫변
];

let currentArm = "right";
let mirrorOn = true;
let quality = "heavy";

// ── 인물 락(Lock) 상태 ──
// locked=false: 화면에서 제일 가까운(큰) 사람 자동 추적
// locked=true : lockSig 지문과 일치하는 사람만 추적, 타인 무시
let personLocked = false;
// 손목 벡터 상태 (pitch 속도 추적 → roll 잠금 판단)
const rollLocked=false;  // (구)속도기반 잠금 - 스윙-트위스트 분해로 대체되어 항상 false
let lockSig = null;      // 락된 사람의 지문 {cx, cy, shoulderW}
let lockLostFrames = 0;  // 락된 사람을 못 찾은 연속 프레임 수
let lastTrackPos = null; // 직전 프레임 추적 인물의 어깨 중점 (교체 감지용, 인덱스는 불안정)

// ════════════════════════════════════════════════════════
// 3D 벡터 유틸
// ════════════════════════════════════════════════════════
const V = {
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}),
  scale:(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}),
  dot:(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  cross:(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x}),
  len:(a)=>Math.hypot(a.x,a.y,a.z),
  norm:(a)=>{const L=V.len(a); return L<1e-9?{x:0,y:0,z:0}:V.scale(a,1/L);},
  angle:(a,b)=>{
    const c=Math.max(-1,Math.min(1,V.dot(V.norm(a),V.norm(b))));
    return Math.acos(c)*180/Math.PI;
  },
  // 로드리게스 회전: v를 axis 둘레로 deg만큼 회전
  rotateAround:(v,axis,deg)=>{
    const k=V.norm(axis), th=deg*Math.PI/180;
    const c=Math.cos(th), s=Math.sin(th);
    return V.add(V.add(V.scale(v,c), V.scale(V.cross(k,v),s)),
                 V.scale(k, V.dot(k,v)*(1-c)));
  },
  // axis 둘레로 a→b 부호있는 각 (-180~180)
  signedAngle:(a,b,axis)=>{
    const ax=V.norm(axis);
    const ap=V.norm(V.sub(a,V.scale(ax,V.dot(a,ax))));
    const bp=V.norm(V.sub(b,V.scale(ax,V.dot(b,ax))));
    if(V.len(ap)<1e-6||V.len(bp)<1e-6) return 0;
    let ang=V.angle(ap,bp);
    if(V.dot(V.cross(ap,bp),ax)<0) ang=-ang;
    return ang;
  },
  // 각도차를 -180~180으로
  wrap180:(d)=>{
    while(d>180) d-=360;
    while(d<-180) d+=360;
    return d;
  }
};

// ════════════════════════════════════════════════════════
// One Euro Filter (3D) — 고품질이라 더 부드럽게 튜닝
// ════════════════════════════════════════════════════════
class OneEuro3D {
  constructor(minCutoff=1.0, beta=0.007, dCutoff=1.0){
    this.minCutoff=minCutoff; this.beta=beta; this.dCutoff=dCutoff;
    this.x=null; this.dx={x:0,y:0,z:0}; this.t=null;
  }
  alpha(cutoff,dt){const r=2*Math.PI*cutoff*dt; return r/(r+1);}
  filter(p,t){
    if(this.x===null){this.x={x:p.x,y:p.y,z:p.z}; this.t=t; return {...this.x};}
    const dt=Math.max(1e-3,(t-this.t)/1000); this.t=t;
    const dxRaw={x:(p.x-this.x.x)/dt, y:(p.y-this.x.y)/dt, z:(p.z-this.x.z)/dt};
    const aD=this.alpha(this.dCutoff,dt);
    this.dx={x:aD*dxRaw.x+(1-aD)*this.dx.x, y:aD*dxRaw.y+(1-aD)*this.dx.y, z:aD*dxRaw.z+(1-aD)*this.dx.z};
    const speed=V.len(this.dx);
    const cutoff=this.minCutoff+this.beta*speed;
    const a=this.alpha(cutoff,dt);
    this.x={x:a*p.x+(1-a)*this.x.x, y:a*p.y+(1-a)*this.x.y, z:a*p.z+(1-a)*this.x.z};
    return {...this.x};
  }
  reset(){this.x=null; this.dx={x:0,y:0,z:0}; this.t=null;}
}
class OneEuro1D {
  constructor(minCutoff=1.0, beta=0.01){ this.f=new OneEuro3D(minCutoff,beta); }
  filter(v,t){ return this.f.filter({x:v,y:0,z:0},t).x; }
  reset(){ this.f.reset(); }
}

const filters = {
  shoulder:new OneEuro3D(), elbow:new OneEuro3D(), wrist:new OneEuro3D(), otherShoulder:new OneEuro3D(),
  shScreen:new OneEuro3D(0.7,0.004), elScreen:new OneEuro3D(0.7,0.004), wrScreen:new OneEuro3D(0.7,0.004),
  handWr:new OneEuro3D(), handIdx:new OneEuro3D(), handPky:new OneEuro3D(), handMid:new OneEuro3D(),
  wristLRSmooth:new OneEuro1D(0.8,0.006), shoulderLRSmooth:new OneEuro1D(0.8,0.006),
  wristUDSmooth:new OneEuro1D(0.8,0.006)
};
const handScreenFilters = Array.from({length:21}, ()=>new OneEuro3D(0.7,0.004));
function resetAllFilters(){
  for(const k in filters) filters[k].reset();
  handScreenFilters.forEach(f=>f.reset());
  if(typeof shoulderLRTrackerReset==="function") shoulderLRTrackerReset();  // 어깨 좌우 연속각도 리셋
}

// ════════════════════════════════════════════════════════
// DOM
// ════════════════════════════════════════════════════════
const $cam=document.getElementById("cam");
const $overlay=document.getElementById("overlay");
const $view3d=document.getElementById("view3d");
const $hud=document.getElementById("hud");
const $status=document.getElementById("status");
const $stage=document.getElementById("stage");
const $btnStart=document.getElementById("btnStart");
const $btnFlip=document.getElementById("btnFlip");
const $btnArm=document.getElementById("btnArm");
const $btnMirror=document.getElementById("btnMirror");
const $btnQuality=document.getElementById("btnQuality");
const $btnLock=document.getElementById("btnLock");
const $btnCalib=document.getElementById("btnCalib");
const $btnRobot=document.getElementById("btnRobot");
const $btnDiag=document.getElementById("btnDiag");
const $btnRom=document.getElementById("btnRom");
const ctx=$overlay.getContext("2d");
const ctx3d=$view3d.getContext("2d");

// ════════════════════════════════════════════════════════
// 워커
// ════════════════════════════════════════════════════════
let poseWorker=null, handWorker=null;
let poseReady=false, handReady=false, poseBusy=false, handBusy=false;
let lastPose=null, lastHands=null, poseMs=0, handMs=0;
let poseDelegate="?", handDelegate="?";

function makeWorker(){
  const src=document.getElementById("workerSrc").textContent;
  const blob=new Blob([src],{type:"application/javascript"});
  return new Worker(URL.createObjectURL(blob));
}
function spawnWorkers(){
  if(poseWorker) poseWorker.terminate();
  if(handWorker) handWorker.terminate();
  poseReady=handReady=poseBusy=handBusy=false;
  lastPose=lastHands=null;

  poseWorker=makeWorker(); handWorker=makeWorker();
  poseWorker.onmessage=onWorkerMessage("pose");
  handWorker.onmessage=onWorkerMessage("hand");

  poseWorker.postMessage({type:"init",kind:"pose",bundleUrl:BUNDLE_URL,wasmRoot:WASM_ROOT,
    modelUrl:POSE_MODELS[quality],opts:CONF});
  handWorker.postMessage({type:"init",kind:"hand",bundleUrl:BUNDLE_URL,wasmRoot:WASM_ROOT,
    modelUrl:HAND_MODEL,opts:CONF});
}
function onWorkerMessage(label){
  return (e)=>{
    const d=e.data;
    if(d.type==="ready"){
      if(label==="pose"){poseReady=true; poseDelegate=d.delegate;}
      else {handReady=true; handDelegate=d.delegate;}
      checkReady();
    } else if(d.type==="result"){
      if(d.kind==="pose"){lastPose=d.result; poseMs=d.ms; poseBusy=false;}
      else {lastHands=d.result; handMs=d.ms; handBusy=false;}
    } else if(d.type==="error"){
      $status.style.opacity=1;
      $status.textContent=`${d.kind} worker 오류: ${d.message}`;
      console.error(d);
    }
  };
}
function checkReady(){
  if(poseReady&&handReady){
    $status.textContent=`준비 완료 (pose:${poseDelegate} / hand:${handDelegate}) — ▶ 시작`;
    if(running){ $status.style.opacity=0; }
    else setTimeout(()=>{$status.style.opacity=0.5;},1400);
  }
}
spawnWorkers();

// ════════════════════════════════════════════════════════
// 카메라
// ════════════════════════════════════════════════════════
let stream=null, facing="user", running=false;

async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    // 카메라 + 마이크 동시 요청 (박수 트리거용)
    stream=await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720} },
      audio:true
    });
    $cam.srcObject=stream;
    applyMirror();
    await $cam.play();
    if(!$cam.videoWidth){
      await new Promise(res=>{ $cam.onloadedmetadata=res; setTimeout(res,1000); });
    }
    resizeCanvases();
    resetAllFilters();
    // 박수 감지 시작 (마이크가 있으면)
    initClapDetection(stream);
    $hud.hidden=false;
    $status.style.opacity=0;
    running=true;
    requestAnimationFrame(loop);
  }catch(err){
    // 마이크 거부됐어도 카메라만으로 재시도
    if(String(err.name)==="NotAllowedError" || String(err).includes("audio")){
      try{
        stream=await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720} }, audio:false
        });
        $cam.srcObject=stream; applyMirror(); await $cam.play();
        if(!$cam.videoWidth){ await new Promise(res=>{ $cam.onloadedmetadata=res; setTimeout(res,1000); }); }
        resizeCanvases(); resetAllFilters();
        $hud.hidden=false; $status.style.opacity=0; running=true;
        setStatus("⚠ 마이크 거부됨 — 박수 트리거 비활성, 키보드만 사용 가능");
        setTimeout(()=>{$status.style.opacity=0;},2500);
        requestAnimationFrame(loop);
        return;
      }catch(e2){
        setStatus("카메라 실패: "+e2.message); return;
      }
    }
    $status.style.opacity=1;
    $status.textContent="카메라 실패: "+err.message;
  }
}

// ── 박수 감지 (오디오 급격한 피크 = 박수) ──
let audioCtx=null, clapAnalyser=null, clapData=null, clapActive=false;
let clapTimes=[];          // 최근 박수 시각들
let clapEnergyPrev=0;
function initClapDetection(mediaStream){
  const tracks=mediaStream.getAudioTracks();
  if(tracks.length===0){ clapActive=false; return; }
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(mediaStream);
    clapAnalyser=audioCtx.createAnalyser();
    clapAnalyser.fftSize=512;
    clapAnalyser.smoothingTimeConstant=0.1;
    src.connect(clapAnalyser);
    clapData=new Uint8Array(clapAnalyser.frequencyBinCount);
    clapActive=true;
  }catch(e){ clapActive=false; }
}
// 매 프레임 호출: 박수 개수 감지해서 콜백
function pollClaps(){
  if(!clapActive||!clapAnalyser) return;
  clapAnalyser.getByteFrequencyData(clapData);
  // 전체 에너지 (고주파 위주로 박수 특성 강조)
  let energy=0;
  for(let i=clapData.length*0.3|0;i<clapData.length;i++) energy+=clapData[i];
  energy/=(clapData.length*0.7);

  const now=performance.now();
  // 급격한 상승 = 박수 (임계값 + 직전보다 크게 증가 + 쿨다운)
  if(energy>CLAP_THRESHOLD && energy-clapEnergyPrev>CLAP_RISE){
    if(clapTimes.length===0 || now-clapTimes[clapTimes.length-1]>CLAP_MIN_GAP){
      clapTimes.push(now);
    }
  }
  clapEnergyPrev=energy;

  // 오래된 박수 기록 제거 (박수 묶음 판정 윈도우)
  clapTimes=clapTimes.filter(t=>now-t<CLAP_WINDOW);
}
// 박수 파라미터 (튜닝 가능)
const CLAP_THRESHOLD=90;   // 박수로 칠 최소 에너지 (0~255)
const CLAP_RISE=35;        // 직전 대비 상승폭
const CLAP_MIN_GAP=150;    // 박수 사이 최소 간격(ms) — 중복 방지
const CLAP_WINDOW=1500;    // 이 시간 안의 박수를 한 묶음으로 셈(ms)
function applyMirror(){
  // 전면(user)일 때만 반전 의미 있음. 사용자 토글과 합쳐서 결정
  const shouldMirror = mirrorOn && facing==="user";
  $stage.classList.toggle("mirror", shouldMirror);
}
function resizeCanvases(){
  const rect=$overlay.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  $overlay.width=Math.round(rect.width*dpr);
  $overlay.height=Math.round(rect.height*dpr);
}
function normToCanvas(nx,ny){
  const cw=$overlay.width, ch=$overlay.height;
  const vw=$cam.videoWidth||1280, vh=$cam.videoHeight||720;
  if(!vw||!vh) return {x:nx*cw,y:ny*ch};
  const scale=Math.max(cw/vw,ch/vh);
  const dispW=vw*scale, dispH=vh*scale;
  return { x:(cw-dispW)/2 + nx*dispW, y:(ch-dispH)/2 + ny*dispH };
}

// ════════════════════════════════════════════════════════
// 데이터 추출
// ════════════════════════════════════════════════════════
// ── 인물 선택: 여러 후보 중 추적할 사람의 인덱스 결정 ──
// 각 사람의 '지문' = 어깨 중점 위치 + 어깨 너비 (화면 정규좌표 기준)
function personSignature(sl){
  const ls=sl[POSE_IDX.LSh], rs=sl[POSE_IDX.RSh];
  if(!ls||!rs) return null;
  const cx=(ls.x+rs.x)/2, cy=(ls.y+rs.y)/2;
  const shoulderW=Math.hypot(ls.x-rs.x, ls.y-rs.y);
  return { cx, cy, shoulderW };
}

function choosePersonIndex(pose){
  if(!pose||!pose.landmarks||pose.landmarks.length===0) return -1;
  const n=pose.landmarks.length;

  // 각 후보의 지문 계산
  const sigs=[];
  for(let i=0;i<n;i++){
    const s=personSignature(pose.landmarks[i]);
    sigs.push(s);
  }

  if(!personLocked){
    // 락 안 걸림 → 제일 큰(가까운) 사람 = 어깨너비 최대
    let best=-1, bestW=-1;
    for(let i=0;i<n;i++){
      if(sigs[i] && sigs[i].shoulderW>bestW){ bestW=sigs[i].shoulderW; best=i; }
    }
    return best;
  }

  // 락 걸림 → lockSig와 가장 비슷한 사람 찾기
  if(!lockSig){ return -1; }
  let best=-1, bestScore=1e9;
  // 놓친 시간이 길수록 위치 조건 완화 (사람이 이동 후 복귀할 수 있게)
  // 0프레임=위치 엄격, 60프레임+=위치 거의 무시하고 체격(어깨너비)으로만 매칭
  const posWeight=Math.max(0.15, 1 - lockLostFrames/60);
  for(let i=0;i<n;i++){
    if(!sigs[i]) continue;
    const dPos=Math.hypot(sigs[i].cx-lockSig.cx, sigs[i].cy-lockSig.cy);
    const dSize=Math.abs(sigs[i].shoulderW-lockSig.shoulderW);
    const score=dPos*posWeight + dSize*1.2;
    if(score<bestScore){ bestScore=score; best=i; }
  }

  // 수락 임계값도 놓친 시간에 비례해 완화
  const accept=0.25 + Math.min(0.35, lockLostFrames*0.01);
  if(bestScore>accept){
    lockLostFrames++;
    return -1;  // 이번 프레임은 아무도 안 잡음 (엉뚱한 사람 잡느니 대기)
  }

  // 매칭 성공 → 지문 갱신(사람이 움직이니까 서서히 따라감) + 위치 기억
  lockLostFrames=0;
  lockSig.cx = lockSig.cx*0.7 + sigs[best].cx*0.3;
  lockSig.cy = lockSig.cy*0.7 + sigs[best].cy*0.3;
  lockSig.shoulderW = lockSig.shoulderW*0.7 + sigs[best].shoulderW*0.3;
  return best;
}

function extractArm(pose, arm, t){
  if(!pose||!pose.worldLandmarks||pose.worldLandmarks.length===0) return null;
  const pIdx=choosePersonIndex(pose);
  if(pIdx<0){ lastTrackPos=null; return null; }
  const wl=pose.worldLandmarks[pIdx], sl=pose.landmarks[pIdx];
  if(!wl||!sl) return null;

  // 추적 대상 교체 감지: 어깨 중점이 한 프레임에 크게 점프하면 다른 사람으로 넘어간 것
  // (인덱스는 프레임마다 뒤바뀔 수 있어 위치로 판단)
  const sig=personSignature(sl);
  if(sig){
    if(lastTrackPos){
      const jump=Math.hypot(sig.cx-lastTrackPos.cx, sig.cy-lastTrackPos.cy);
      if(jump>0.15){  // 화면의 15% 이상 순간이동 = 사람 교체
        resetAllFilters();
      }
    }
    lastTrackPos={cx:sig.cx, cy:sig.cy};
  }

  const R=arm==="right";
  const shW=wl[R?POSE_IDX.RSh:POSE_IDX.LSh];
  const elW=wl[R?POSE_IDX.RElb:POSE_IDX.LElb];
  const wrW=wl[R?POSE_IDX.RWr:POSE_IDX.LWr];
  const oshW=wl[R?POSE_IDX.LSh:POSE_IDX.RSh];
  const shS=sl[R?POSE_IDX.RSh:POSE_IDX.LSh];
  const elS=sl[R?POSE_IDX.RElb:POSE_IDX.LElb];
  const wrS=sl[R?POSE_IDX.RWr:POSE_IDX.LWr];
  const oshS=sl[R?POSE_IDX.LSh:POSE_IDX.RSh];

  // MediaPipe visibility/presence가 낮은 프레임은 ROM 측정에서 제외할 수 있게 품질값 전달
  const lmConf=(p)=>{
    if(!p) return 0;
    const v=typeof p.visibility==="number"?p.visibility:1;
    const pr=typeof p.presence==="number"?p.presence:1;
    return Math.min(v,pr);
  };
  const trackConfidence=Math.min(lmConf(shS),lmConf(elS),lmConf(wrS),lmConf(oshS));

  const sh=filters.shoulder.filter(shW,t);
  const el=filters.elbow.filter(elW,t);
  const wr=filters.wrist.filter(wrW,t);
  const osh=filters.otherShoulder.filter(oshW,t);

  const shScreen=filters.shScreen.filter({x:shS.x,y:shS.y,z:0},t);
  const elScreen=filters.elScreen.filter({x:elS.x,y:elS.y,z:0},t);
  const wrScreen=filters.wrScreen.filter({x:wrS.x,y:wrS.y,z:0},t);

  const upper=V.sub(el,sh);
  const fore=V.sub(wr,el);
  const shLine=V.sub(osh,sh);

  // ── 몸통 좌표계 (양 어깨 기반) — 모든 각도의 안정적 기준 ──
  // bodyX: 오른어깨→왼어깨, bodyY: 아래(직교화), bodyZ: 몸 앞방향
  const bodyX = (arm==="right") ? V.norm(shLine) : V.norm(V.scale(shLine,-1));
  let bodyZ = V.cross(bodyX, {x:0,y:1,z:0});
  if(V.len(bodyZ)<1e-6) bodyZ={x:0,y:0,z:-1};  // 퇴화 방지
  bodyZ = V.norm(bodyZ);
  const bodyY = V.norm(V.cross(bodyZ, bodyX));

  // ── 관절축 정의 ──
  // CH0: 상완의 좌우 회전. 상완을 몸통 가로축(bodyX)-앞축(bodyZ) 평면에 투영해 계산한다.
  //      몸통 자체의 yaw는 사용하지 않는다. 팔이 완전히 수직이면 수평 투영이 작아져 이전값을 유지한다.
  // CH1: 상완의 상하 움직임. 몸통 아래축(bodyY)과 상완의 각도이며 아래=0°, 수평=90°, 위=180°.
  // CH2: 기존과 동일한 팔꿈치 굽힘량. 편 상태=0°, 접을수록 증가.
  const upperN=V.norm(upper);
  const shoulderLRX=V.dot(upperN,bodyX);
  const shoulderLRZ=V.dot(upperN,bodyZ);
  const shoulderLRHorizontal=Math.hypot(shoulderLRX,shoulderLRZ);
  const shoulderLRRaw=Math.atan2(shoulderLRX,shoulderLRZ)*180/Math.PI;

  const elbowInternal=V.angle(V.scale(upper,-1),fore);
  const elbowFlexion=180-elbowInternal;
  const shoulderUpDown=V.angle(upper,bodyY);

  return { sh,el,wr,osh, upper,fore,shLine,
           bodyX,bodyY,bodyZ,
           elbowInternal,elbowFlexion,
           shoulderLRRaw,shoulderLRHorizontal,shoulderUpDown,
           // 이전 진단 코드 호환용 별칭
           shoulderAbduction:shoulderUpDown,
           trackConfidence,
           screen:{sh:shScreen,el:elScreen,wr:wrScreen} };
}

function extractHand(hands, arm, t, armWristNorm){
  if(!hands||!hands.worldLandmarks||hands.worldLandmarks.length===0) return null;
  const nHands=hands.worldLandmarks.length;

  let pickIdx=0;

  if(nHands===1){
    // 손 하나면 그냥 그거
    pickIdx=0;
  } else {
    // 손이 여러 개 → 추적 중인 팔의 손목(화면 정규좌표)과 가장 가까운 손 선택
    // armWristNorm: {x,y} (0~1 정규화 화면좌표), extractArm의 손목 스크린값
    if(armWristNorm){
      let best=1e9;
      for(let i=0;i<nHands;i++){
        const sc=hands.landmarks[i];
        if(!sc) continue;
        const hw=sc[HAND_IDX.Wr];  // 손 손목 (정규좌표)
        const dx=hw.x-armWristNorm.x, dy=hw.y-armWristNorm.y;
        const d=dx*dx+dy*dy;
        if(d<best){ best=d; pickIdx=i; }
      }
      // 손목은 팔에 고정되므로 위치는 안 튐. 거리는 '어느 손인지' 고르는 용도만.
      // 임계값 넉넉하게 (0.12) — 올바른 손을 놓치지 않게
      if(best>0.12){
        filters.handWr.reset(); filters.handIdx.reset(); filters.handPky.reset();
        handScreenFilters.forEach(f=>f.reset());
        return null;
      }
    } else {
      // 팔 손목 정보 없으면 라벨로 폴백
      const wantSide=(arm==="right")?"Left":"Right";
      for(let i=0;i<nHands;i++){
        const hd=hands.handedness[i];
        const label=(Array.isArray(hd)?hd[0]?.categoryName:hd?.categoryName)||"";
        if(label===wantSide){pickIdx=i; break;}
      }
    }
  }

  const hlWorld=hands.worldLandmarks[pickIdx];
  const hlScreen=hands.landmarks[pickIdx];
  if(!hlWorld||!hlScreen) return null;
  const pickedHd=hands.handedness[pickIdx];
  const pickedCat=Array.isArray(pickedHd)?pickedHd[0]:pickedHd;
  const handConfidence=typeof pickedCat?.score==="number"?pickedCat.score:1;

  const wr=filters.handWr.filter(hlWorld[HAND_IDX.Wr],t);
  const idx=filters.handIdx.filter(hlWorld[HAND_IDX.IndexMcp],t);
  const pky=filters.handPky.filter(hlWorld[HAND_IDX.PinkyMcp],t);
  const mid=filters.handMid.filter(hlWorld[HAND_IDX.MiddleMcp],t);

  // ── 손 좌표계 (직교 3축) — pitch와 roll을 깔끔히 분리하기 위함 ──
  // forward: 손목→중지뿌리 = 손이 뻗은 방향 (손가락 펴짐 여부와 무관하게 안정적)
  // side   : 검지뿌리→새끼뿌리 = 손 가로 방향
  // normal : forward × side = 손바닥에 수직 (손등/손바닥 방향)
  const fwd = V.norm(V.sub(mid, wr));
  let side = V.sub(pky, idx);
  // side를 forward에 직교화 (그람-슈미트) → 축이 서로 완전히 수직
  side = V.norm(V.sub(side, V.scale(fwd, V.dot(side, fwd))));
  let normal = V.cross(fwd, side);
  if(arm!=="left") normal = V.scale(normal, -1);  // 좌우손 법선 방향 통일
  normal = V.norm(normal);

  // palmDir(옛 호환용) = forward
  const palmDir = fwd;

  const screen=hlScreen.map((p,i)=>{
    const f=handScreenFilters[i].filter({x:p.x,y:p.y,z:0},t);
    return {x:f.x,y:f.y};
  });

  // 팔 손목에 고정된 화면좌표: 손 손목(screen[0]) 기준 상대좌표를
  // 팔 손목(armWristNorm) 위치로 평행이동 → 손목이 항상 팔 벡터 끝에 붙음
  let anchored=screen;
  if(armWristNorm){
    const hWrScreen=screen[HAND_IDX.Wr];
    const dx=armWristNorm.x-hWrScreen.x;
    const dy=armWristNorm.y-hWrScreen.y;
    anchored=screen.map(p=>({x:p.x+dx, y:p.y+dy}));
  }

  return { wr,idx,pky,mid, fwd,side,normal,palmDir,
           confidence:handConfidence, worldLm:hlWorld, screen, anchored };
}

// ════════════════════════════════════════════════════════
// 메인 루프
// ════════════════════════════════════════════════════════
let lastSendTs=0, frameClock=0;
let fpsCount=0, fpsTime=performance.now(), fpsVal=0;

function loop(ts){
  if(!running) return;
  if($cam.readyState>=2 && ts-lastSendTs>16){  // 최대 ~60fps 디스패치
    frameClock+=1;
    const stamp=frameClock;
    if(poseReady&&!poseBusy){
      poseBusy=true;
      createImageBitmap($cam).then(bmp=>{
        poseWorker.postMessage({type:"frame",bitmap:bmp,ts:stamp},[bmp]);
      }).catch(()=>{poseBusy=false;});
    }
    if(handReady&&!handBusy){
      handBusy=true;
      createImageBitmap($cam).then(bmp=>{
        handWorker.postMessage({type:"frame",bitmap:bmp,ts:stamp},[bmp]);
      }).catch(()=>{handBusy=false;});
    }
    lastSendTs=ts;
  }
  render(ts);

  // ── 박수 감지 + 트리거 처리 ──
  pollClaps();
  handleClapTriggers(ts);

  fpsCount++;
  if(ts-fpsTime>=500){ fpsVal=fpsCount*1000/(ts-fpsTime); fpsCount=0; fpsTime=ts; }
  requestAnimationFrame(loop);
}

// 박수 개수에 따른 트리거: 2번=시동토글, 3~4번=대기
let lastClapAction=0;
function handleClapTriggers(ts){
  if(!clapActive) return;
  // 박수 묶음이 안정될 때까지 잠깐 기다렸다 판정
  if(clapTimes.length===0) return;
  const now=performance.now();
  const lastClap=clapTimes[clapTimes.length-1];
  // 마지막 박수 후 CLAP_SETTLE 지나면 개수 확정
  if(now-lastClap < CLAP_SETTLE) return;
  const n=clapTimes.length;
  clapTimes=[];  // 소비
  if(now-lastClapAction < 800) return;  // 액션 쿨다운
  lastClapAction=now;

  if(n===2){
    toggleArm();           // 박수 2번 = 시동/대기 토글
  } else if(n>=3){
    disarmSystem();        // 박수 3~4번 = 대기(정지)
  }
}
const CLAP_SETTLE=500;   // 마지막 박수 후 이 시간 지나면 묶음 확정(ms)

// ════════════════════════════════════════════════════════
// 렌더링
// ════════════════════════════════════════════════════════
function render(ts){
  ctx.clearRect(0,0,$overlay.width,$overlay.height);
  const arm=extractArm(lastPose,currentArm,ts);
  // 팔의 손목 화면좌표를 손 선택에 넘겨 → 끼어든 손 무시
  const armWristNorm = arm ? { x:arm.screen.wr.x, y:arm.screen.wr.y } : null;
  const hand=extractHand(lastHands,currentArm,ts,armWristNorm);

  if(arm){
    const sh=normToCanvas(arm.screen.sh.x,arm.screen.sh.y);
    const el=normToCanvas(arm.screen.el.x,arm.screen.el.y);
    const wr=normToCanvas(arm.screen.wr.x,arm.screen.wr.y);
    const dpr=window.devicePixelRatio||1;

    // 손가락 뼈대 (옅게) — 손목을 팔 벡터 끝에 고정해서 그림
    if(hand){
      const hp = hand.anchored || hand.screen;
      ctx.strokeStyle="rgba(168,184,255,0.5)";
      ctx.lineWidth=2*dpr;
      ctx.lineCap="round";
      for(const [a,b] of HAND_BONES){
        const pa=normToCanvas(hp[a].x,hp[a].y);
        const pb=normToCanvas(hp[b].x,hp[b].y);
        ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
      }
      for(const p of hp){
        const pp=normToCanvas(p.x,p.y);
        ctx.fillStyle="rgba(168,184,255,0.85)";
        ctx.beginPath(); ctx.arc(pp.x,pp.y,2.5*dpr,0,Math.PI*2); ctx.fill();
      }
    }

    drawArrow(ctx, sh, el, "#ff9e57", 8*dpr);
    drawArrow(ctx, el, wr, "#7be0a8", 8*dpr);
    drawJoint(ctx, sh, dpr); drawJoint(ctx, el, dpr); drawJoint(ctx, wr, dpr);

    let wristUpDownAngle=null;
    let wristLeftRightAngle=null;
    if(hand){
      const fa=V.norm(arm.fore);  // 전완축: 팔꿈치 → 손목

      // ── 전완 고정 손목 좌표계 ──
      // downRef: 몸통 아래축을 전완에 수직인 평면으로 투영한 축.
      // sideRef: 전완축과 downRef에 모두 수직인 좌우축.
      // 손목 상하·좌우는 손 방향(hand.fwd)이 전완축에서 얼마나 벗어났는지 각각 계산한다.
      let downRef=V.sub(arm.bodyY, V.scale(fa,V.dot(arm.bodyY,fa)));
      if(V.len(downRef)<0.15) downRef=V.sub(arm.bodyZ, V.scale(fa,V.dot(arm.bodyZ,fa)));
      if(V.len(downRef)<0.15) downRef=V.sub(arm.bodyX, V.scale(fa,V.dot(arm.bodyX,fa)));
      downRef=V.norm(downRef);
      const sideRef=V.norm(V.cross(fa,downRef));

      const forwardComponent=V.dot(hand.fwd,fa);
      const rawUpDown=Math.atan2(V.dot(hand.fwd,downRef),forwardComponent)*180/Math.PI;
      const rawLeftRight=Math.atan2(V.dot(hand.fwd,sideRef),forwardComponent)*180/Math.PI;

      wristUpDownAngle=filters.wristUDSmooth.filter(rawUpDown,ts);
      wristLeftRightAngle=filters.wristLRSmooth.filter(rawLeftRight,ts);
    }

    // ── 상태 머신에 따른 로봇 제어 ──
    const servos=mapToServos(arm, hand, wristUpDownAngle, wristLeftRightAngle);
    // 최고 가동범위 측정은 로봇 출력 없이, 기본자세 대비 Δ각도만 수집
    if(romActive) romCollectSample(ts,arm,hand);
    // 현재 raw 각도(매칭용)는 mapToServos가 lastRawAngles에 저장함
    poseMatch=computePoseMatch(lastRawAngles);

    // ── 진단용 상세 데이터 (3D 벡터 원시값) ──
    if(diagActive){
      const u=arm.upper, f=arm.fore;
      lastDiagData={
        upper_x:u.x, upper_y:u.y, upper_z:u.z, upper_len:V.len(u),
        fore_x:f.x, fore_y:f.y, fore_z:f.z, fore_len:V.len(f),
        elbowAngle:arm.elbowFlexion, elbowInternal:arm.elbowInternal,
        shoulderUpDown:arm.shoulderUpDown,
        shoulderLeftRight:lastRawAngles[0],
        wristUpDown:wristUpDownAngle!=null?wristUpDownAngle:null,
        wristLeftRight:wristLeftRightAngle!=null?wristLeftRightAngle:null,
        handDetected: hand?1:0
      };
      diagCollectSample();
    }

    if(robotConnected && !romActive){
      if(sysState==='active'){
        // 추적 중: 팔 따라감
        sendToRobot(servos);
      } else if(sysState==='arming'){
        // 시동 준비: 로봇을 실제로 측정한 시작 자세로 이동
        sendToRobot([...ROBOT_START_POSE]);
        // 일치도가 임계 넘고 일정시간 유지되면 → 시동
        if(poseMatch>=POSE_MATCH_THRESHOLD){
          if(matchHoldStart===0) matchHoldStart=ts;
          if(ts-matchHoldStart>=POSE_MATCH_HOLD){
            // ★ 최초 1회 시동 ★
            // 등록 순간의 사람 자세를 기준점으로 고정해 시동 순간 오차가 영점이 되지 않게 함
            calibRef=[...refPose];
            sysState='active';
            matchHoldStart=0;
            setStatus("✅ 시동! 자세 동기화 완료 — 이제 팔을 따라갑니다");
            setTimeout(()=>{$status.style.opacity=0;},1800);
          }
        } else {
          matchHoldStart=0;  // 자세 벗어나면 리셋
        }
      }
      // 'idle'이면 아무것도 안 보냄 (로봇 정지 유지)
    }

    // ── 손목 벡터바 그리기 (전완 끝에서 손 방향으로) ──
    if(hand && hand.anchored){
      const wp=hand.anchored;  // 손목에 고정된 손 화면좌표
      const hWr=normToCanvas(wp[HAND_IDX.Wr].x, wp[HAND_IDX.Wr].y);
      const hMid=normToCanvas(wp[HAND_IDX.MiddleMcp].x, wp[HAND_IDX.MiddleMcp].y);
      // 손목→중지뿌리 방향을 길게 늘여서 벡터바로
      const vx=hMid.x-hWr.x, vy=hMid.y-hWr.y;
      const len=Math.hypot(vx,vy)||1;
      const scale=70*dpr/len;  // 화면상 길이 통일
      const tip={x:hWr.x+vx*scale, y:hWr.y+vy*scale};
      // pitch 잠금(굽힘 동작 중)이면 주황, 아니면 하늘색
      const wcol = rollLocked ? "#ffb057" : "#5fd3e8";
      drawArrow(ctx, hWr, tip, wcol, 5*dpr);
      // roll 잠금 표시 점
      if(rollLocked){
        ctx.fillStyle="#ffb057";
        ctx.font=`${11*dpr}px ui-monospace,monospace`;
        ctx.fillText("roll 잠금", tip.x+6*dpr, tip.y);
      }
    }

    const u=arm.upper, f=arm.fore;
    const diagBanner = diagActive
      ? `<span class="c-diag">🔬 진단 [${diagIdx+1}/${DIAG_POSES.length}] ${DIAG_POSES[diagIdx].name}${diagCapturing?' 📸캡처중':' [스페이스]캡처'}</span>\n`+
        `<span class="dim">${DIAG_POSES[diagIdx].desc}</span>\n`+
        `<span class="dim">─────────────────────────</span>\n`
      : "";
    const romBanner = romActive ? romHudBanner(ts) : "";
    $hud.innerHTML = diagBanner+romBanner+
      `<span class="c-upper">상완  (${fmt(u.x)}, ${fmt(u.y)}, ${fmt(u.z)})  ${V.len(u).toFixed(3)}m</span>\n`+
      `<span class="c-fore">전완  (${fmt(f.x)}, ${fmt(f.y)}, ${fmt(f.z)})  ${V.len(f).toFixed(3)}m</span>\n`+
      `<span class="dim">─────────────────────────</span>\n`+
      `팔꿈치 굽힘   ${arm.elbowFlexion.toFixed(1)}°\n`+
      `<span class="c-yaw">어깨 좌우     ${lastRawAngles[0]!=null?lastRawAngles[0].toFixed(1):'--'}°</span>\n`+
      `어깨 상하     ${arm.shoulderUpDown.toFixed(1)}°\n`+
      (hand
        ? `<span class="c-palm">손목 상하 ${wristUpDownAngle!=null?wristUpDownAngle.toFixed(1):'--'}°  좌우 ${wristLeftRightAngle!=null?wristLeftRightAngle.toFixed(1):'--'}°</span>\n`
        : `<span class="c-palm dim">손목 상하/좌우 (손 미감지)</span>\n`)+
      `<span class="dim">──── 서보 각도 ${robotConnected?'[전송중]':'[미연결]'} ────</span>\n`+
      `<span class="c-srv">S0 어깨좌우 ${servos[0].toFixed(0)}°  S1 어깨상하 ${servos[1].toFixed(0)}°</span>\n`+
      `<span class="c-srv">S2 엘보우 ${servos[2].toFixed(0)}°  S3 손목상하 ${servos[3].toFixed(0)}°</span>\n`+
      `<span class="c-srv">S4 손목좌우 ${servos[4].toFixed(0)}°  S5 OFF</span>\n`+
      `<span class="dim">─────────────────────────</span>\n`+
      // 시스템 상태 표시
      (sysState==='idle'
        ? `<span class="dim">⏸ 대기 — 트리거(엔터/박수2)로 시동</span>\n`
        : sysState==='arming'
        ? `<span class="c-arm">🎯 시동 준비 — 기준자세 취하세요</span>\n`+
          `<span class="c-arm">   일치도 ${(poseMatch*100).toFixed(0)}% ${matchGauge(poseMatch)}</span>\n`
        : `<span class="c-active">▶ 추적 중 — 로봇 동기화됨</span>\n`)+
      (personLocked
        ? `<span class="c-lock">🔓 인물고정</span>`
        : `<span class="dim">인물 미고정</span>`)+
      `<span class="dim">  ·  ${refPose?'📍자세등록됨':'자세 미등록'}</span>`+
      `<span class="dim">  ·  ${clapActive?'🎤박수ON':'🎤OFF'}</span>\n`+
      `<span class="c-fps">화면 ${fpsVal.toFixed(0)} fps</span>\n`+
      `<span class="c-perf">pose ${poseMs.toFixed(0)}ms(${poseDelegate}) · hand ${handMs.toFixed(0)}ms(${handDelegate})</span>`;

    draw3DView(arm, hand);
  } else {
    $hud.innerHTML=`<span class="dim">사람이 안 보여 — 어깨~손목이 프레임에 다 들어오게</span>\n`+
                   `<span class="c-fps">화면 ${fpsVal.toFixed(0)} fps</span>`;
    ctx3d.clearRect(0,0,240,240);
  }
}

function fmt(n){ return (n>=0?"+":"")+n.toFixed(3); }
// 자세 일치도 막대 게이지 (텍스트)
function matchGauge(m){
  const n=Math.round(m*10);
  return "["+"█".repeat(n)+"░".repeat(10-n)+"]";
}

function drawArrow(ctx,p1,p2,color,w){
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=w; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  const a=Math.atan2(p2.y-p1.y,p2.x-p1.x); const L=w*2.2;
  ctx.beginPath(); ctx.moveTo(p2.x,p2.y);
  ctx.lineTo(p2.x-L*Math.cos(a-0.4),p2.y-L*Math.sin(a-0.4));
  ctx.lineTo(p2.x-L*Math.cos(a+0.4),p2.y-L*Math.sin(a+0.4));
  ctx.closePath(); ctx.fill();
}
function drawJoint(ctx,p,dpr){
  ctx.fillStyle="#fff"; ctx.strokeStyle="#000"; ctx.lineWidth=2*dpr;
  ctx.beginPath(); ctx.arc(p.x,p.y,7*dpr,0,Math.PI*2); ctx.fill(); ctx.stroke();
}

// ════════════════════════════════════════════════════════
// 3D 미니뷰 (자동 회전 + 손가락 포함)
// ════════════════════════════════════════════════════════
let viewAngle=0;
function draw3DView(arm, hand){
  const c=ctx3d; c.clearRect(0,0,240,240);
  const cx=120, cy=120, scale=200;
  viewAngle+=0.01;
  const ca=Math.cos(viewAngle), sa=Math.sin(viewAngle);

  const project=(p)=>{
    const x=p.x-arm.sh.x, y=p.y-arm.sh.y, z=p.z-arm.sh.z;
    const x2=x*ca+z*sa, z2=-x*sa+z*ca;
    const depth=1+z2*0.45;
    return {x:cx+x2*scale/depth, y:cy+y*scale/depth, depth};
  };

  // 바닥 그리드
  c.strokeStyle="rgba(120,140,180,0.1)"; c.lineWidth=1;
  for(let gx=-2;gx<=2;gx++){
    const a=project({x:gx*0.15,y:0.0,z:-0.3}), b=project({x:gx*0.15,y:0.0,z:0.3});
    c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke();
  }
  // 축
  c.strokeStyle="rgba(140,160,200,0.2)"; c.lineWidth=1;
  c.beginPath(); c.moveTo(12,cy); c.lineTo(228,cy); c.moveTo(cx,12); c.lineTo(cx,228); c.stroke();

  const ps=project(arm.sh), po=project(arm.osh), pe=project(arm.el), pw=project(arm.wr);

  // 어깨선
  c.strokeStyle="#ff7eaa"; c.lineWidth=2.5;
  c.beginPath(); c.moveTo(ps.x,ps.y); c.lineTo(po.x,po.y); c.stroke();
  // 상완
  c.strokeStyle="#ff9e57"; c.lineWidth=4.5;
  c.beginPath(); c.moveTo(ps.x,ps.y); c.lineTo(pe.x,pe.y); c.stroke();
  // 전완
  c.strokeStyle="#7be0a8"; c.lineWidth=4.5;
  c.beginPath(); c.moveTo(pe.x,pe.y); c.lineTo(pw.x,pw.y); c.stroke();

  // 손 (worldLm을 손목 기준으로 평행이동해서 전완 끝 wr에 붙임)
  if(hand && hand.worldLm){
    const hWr=hand.worldLm[HAND_IDX.Wr];
    const handPts=hand.worldLm.map(p=>project({
      x:arm.wr.x+(p.x-hWr.x), y:arm.wr.y+(p.y-hWr.y), z:arm.wr.z+(p.z-hWr.z)
    }));
    c.strokeStyle="#a8b8ff"; c.lineWidth=1.8;
    for(const [a,b] of HAND_BONES){
      c.beginPath(); c.moveTo(handPts[a].x,handPts[a].y); c.lineTo(handPts[b].x,handPts[b].y); c.stroke();
    }
    // 손바닥 normal (노란 점선)
    const NL=0.08;
    const ne=project({x:arm.wr.x+hand.normal.x*NL, y:arm.wr.y+hand.normal.y*NL, z:arm.wr.z+hand.normal.z*NL});
    c.strokeStyle="#ffd479"; c.lineWidth=2; c.setLineDash([4,3]);
    c.beginPath(); c.moveTo(pw.x,pw.y); c.lineTo(ne.x,ne.y); c.stroke(); c.setLineDash([]);
  }

  // 관절 점
  for(const p of [ps,pe,pw,po]){
    c.fillStyle="#fff"; c.beginPath(); c.arc(p.x,p.y,4,0,Math.PI*2); c.fill();
  }

  c.fillStyle="rgba(207,224,240,0.55)"; c.font="10px ui-monospace,monospace";
  c.fillText("3D · auto-rotate", 8, 230);
}

// ════════════════════════════════════════════════════════
// 로봇 제어 — Web Serial + 사람팔 → 5축 구동(CH0~CH4), CH5 OFF
// ════════════════════════════════════════════════════════
let serialPort=null, serialWriter=null, robotConnected=false;
let lastRobotSend=0;
const ROBOT_INTERVAL=50;  // ms, 1초 20회 전송 (서보가 따라올 수 있는 속도)

// 각 서보의 출력 범위 (아두이노 SERVO_RANGE와 일치시킬 것)
const SERVO_RANGE=[280,280,180,180,180,180];

// 수동조종기로 확정한 실제 로봇 시작 자세
// CH5는 펌웨어에서 PWM OFF지만 통신 호환을 위해 90을 유지
const ROBOT_START_POSE=[10,1,95,137.5,94,90];

// 실제 기구에 적용할 안전 출력 범위. CH2는 펌웨어와 동일하게 30~150°.
const JOINT_MIN=[0,0,30,0,0,90];
const JOINT_MAX=[280,280,150,180,180,90];

// 방향 + 민감도 (offset은 캘리브레이션이 담당)
const MAP_CFG=[
  { dir:+1, gain:1.0 },  // 0 어깨 좌우
  { dir:-1, gain:1.0 },  // 1 어깨 상하 — 사용자 팔을 들면 로봇도 들도록 방향 반전
  { dir:+1, gain:1.0 },  // 2 엘보우 (굽힘량: 편 상태 0° → 접을수록 증가)
  { dir:+1, gain:1.0 },  // 3 손목 상하
  { dir:+1, gain:1.0 },  // 4 손목 좌우
  { dir:+1, gain:0.0 },  // 5 미사용(CH5 PWM OFF)
];

// 시동 자세(캘리브레이션) 기준값. null=미보정
let calibRef=null;

// ══ 시스템 상태 머신 ══
// 'idle'   : 대기 — 로봇 정지, 자세 매칭 안 함
// 'arming' : 시동 준비 — 트리거됨, 기준자세 취하길 대기 (일치도 체크 중)
// 'active' : 추적 중 — 로봇이 팔 따라함
let sysState='idle';

// ── 기준 자세 (등록해두는 목표 포즈) ──
// v8.5 전용 키를 사용해 이전 버전의 CH2/그리퍼 기준값이 섞이지 않게 함.
const REFPOSE_STORAGE_KEY='armvec_refpose_v87_joint_axes';
let refPose=null;
try{
  const saved=localStorage.getItem(REFPOSE_STORAGE_KEY);
  if(saved) refPose=JSON.parse(saved);
}catch(e){}

// 현재 팔 자세가 기준 자세와 얼마나 일치하는지 (0~1)
let poseMatch=0;
// arming 상태에서 일치 유지 시간 (너무 순간적 매칭 방지)
let matchHoldStart=0;

// 자세 일치도 계산: 각 관절 각도 차이를 종합
function computePoseMatch(raw){
  if(!refPose) return 0;
  let totalDiff=0, count=0;
  // 팔 자세 핵심 관절만 비교 (베이스, 숄더, 엘보우) — 손목과 미사용 CH5는 제외
  const weights=[1.0, 1.0, 1.0, 0, 0, 0];  // 0~2번만
  for(let i=0;i<6;i++){
    if(weights[i]===0) continue;
    if(raw[i]==null || refPose[i]==null) continue;
    // CH0 어깨 좌우(연속각)는 wrap-safe 차이
    let d = (i===0) ? Math.abs(V.wrap180(raw[i]-refPose[i])) : Math.abs(raw[i]-refPose[i]);
    // 각도 차이를 0~1로 (30도 차이면 0점, 0도면 1점)
    const score=Math.max(0, 1 - d/POSE_MATCH_TOLERANCE);
    totalDiff+=score*weights[i];
    count+=weights[i];
  }
  return count>0 ? totalDiff/count : 0;
}
const POSE_MATCH_TOLERANCE=35;   // 관절당 허용 각도차 (도)
const POSE_MATCH_THRESHOLD=0.80; // 이 이상이면 자세 일치로 판정
const POSE_MATCH_HOLD=400;       // 이 시간(ms) 유지해야 시동
// 미보정 시 기본 기준 (팔 자연스럽게 폈을 때 예상 raw)
// 미보정 기본 기준: 어깨 좌우 정면=0, 어깨 상하=90, 엘보우 편 상태=0, 손목 중립=0, CH5 미사용=90
const rawDefaultRef=[0, 90, 0, 0, 0, 90];
let lastRawAngles=[null,null,null,null,null,null];

function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }

// 마지막 유효 서보값 — 인식 끊겨도 기본자세로 안 튀게 유지
let lastServoOut=[...ROBOT_START_POSE];

// 사람 팔 데이터 → raw 각도 5개 + CH5 미사용
// ── CH0 어깨 좌우 연속각 누적기 ──
// 상완의 몸통 기준 좌우 방위각을 사용한다. 몸통 yaw나 손목 위치는 CH0 계산에 사용하지 않는다.
let shoulderLRCont=null, shoulderLRPrevRaw=null;
function shoulderLRTrackerUpdate(arm){
  if(!arm || !Number.isFinite(arm.shoulderLRRaw)) return shoulderLRCont!=null?shoulderLRCont:0;
  // 팔이 거의 수직이면 상완의 수평 투영이 사라져 좌우각이 불안정하므로 직전값 유지
  if((arm.shoulderLRHorizontal??0)<0.10) return shoulderLRCont!=null?shoulderLRCont:0;
  const raw=arm.shoulderLRRaw;
  if(shoulderLRPrevRaw===null){ shoulderLRCont=raw; }
  else { shoulderLRCont += V.wrap180(raw-shoulderLRPrevRaw); }
  shoulderLRPrevRaw=raw;
  return shoulderLRCont;
}
function shoulderLRTrackerReset(){ shoulderLRCont=null; shoulderLRPrevRaw=null; }

function extractRawAngles(arm, hand, wristUpDownAngle, wristLeftRightAngle){
  const raw=[null,null,null,null,null,null];
  raw[0]=shoulderLRTrackerUpdate(arm);                 // CH0 어깨 좌우 회전 (몸통 가로축 기준)
  raw[1]=arm.shoulderUpDown;                           // CH1 어깨 상하 (아래 0°, 수평 90°, 위 180°)
  raw[2]=arm.elbowFlexion;                             // CH2 엘보우 굽힘량 (편 상태=0°)
  if(wristUpDownAngle!=null) raw[3]=wristUpDownAngle;  // CH3 손목 상하 (전완 기준)
  if(wristLeftRightAngle!=null) raw[4]=wristLeftRightAngle; // CH4 손목 좌우 (전완 기준)
  raw[5]=null;
  return raw;
}

// raw → 서보각 (캘리브레이션 기준 상대 변환)
function rawToServos(raw){
  const out=[...lastServoOut];
  for(let i=0;i<5;i++){
    if(raw[i]==null) continue;
    const c=MAP_CFG[i];
    const ref = calibRef ? calibRef[i] : (refPose ? refPose[i] : rawDefaultRef[i]);
    const rawDelta = (i===0) ? V.wrap180(raw[i]-ref) : (raw[i]-ref);
    const delta = rawDelta * c.dir * c.gain;
    out[i]=clamp(ROBOT_START_POSE[i]+delta, JOINT_MIN[i], JOINT_MAX[i]);
  }
  // CH5는 제거됨. 통신 형식 유지를 위해 90을 보내며 펌웨어는 PWM을 끔.
  out[5]=90;
  lastServoOut=out;
  return out;
}

// 통합: 팔 데이터 → 서보 6각도
function mapToServos(arm, hand, wristUpDownAngle, wristLeftRightAngle){
  const raw=extractRawAngles(arm, hand, wristUpDownAngle, wristLeftRightAngle);
  lastRawAngles=raw;
  return rawToServos(raw);
}

// ══════════════════════════════════════════════════════════
// 최고 가동범위 측정 — CH0 → CH1 → CH2 → CH3 → CH4 순차 측정
// 각 채널은 등록된 사람 기본자세(ROBOT_START_POSE 대응 자세)를 다시 확인한 뒤 시작한다.
// 로봇 출력은 측정 전체 동안 OFF이며, 현재 단계의 한 축만 기록한다.
// ══════════════════════════════════════════════════════════
const ROM_CHANNELS=[
  { ch:0, key:"shoulder_left_right", name:"어깨 좌우", jump:20, margin:3,
    instruction:"상완만 좌우로 천천히 돌리세요. 몸통은 정면 고정." },
  { ch:1, key:"shoulder_up_down", name:"어깨 상하", jump:18, margin:3,
    instruction:"상완을 아래·위 끝까지 천천히 움직이세요." },
  { ch:2, key:"elbow_flexion", name:"엘보우", jump:22, margin:3,
    instruction:"상완을 고정하고 팔꿈치를 편 상태와 최대 굽힘 사이로 움직이세요." },
  { ch:3, key:"wrist_up_down", name:"손목 상하", jump:24, margin:4,
    instruction:"전완을 고정하고 손목만 위·아래로 움직이세요." },
  { ch:4, key:"wrist_left_right", name:"손목 좌우", jump:24, margin:4,
    instruction:"전완을 고정하고 손목만 좌·우로 움직이세요. 손목 비틀기는 하지 마세요." },
];
const ROM_MIN_AXIS_DURATION=8000;
const ROM_MIN_AXIS_SAMPLES=40;
const ROM_Q_LOW=0.02;
const ROM_Q_HIGH=0.98;
const ROM_CONFIDENCE_MIN=0.55;
const ROM_BASE_HOLD=800;
const ROM_BASE_TOL=[14,14,16,18,18];

let romActive=false;
let romSessionStartTs=0;
let romAxisStartTs=0;
let romRefPose=null;
let romAxes=[];
let romStep=0;
let romPhase="idle"; // idle | await_base | measuring
let romBaseHoldStart=0;
let romBaseMatch=0;
let romResult=null;
let romRejected=0;
let romLowConfidenceRejected=0;

function romResetAxes(){
  romAxes=ROM_CHANNELS.map(c=>({
    ...c, samples:[], current:null, min:null, max:null,
    last:null, lastTs:0, pending:null, pendingTs:0,
    rejected:0, lowConfidenceRejected:0,
    startedAt:null, endedAt:null, durationMs:0, completed:false
  }));
  romRejected=0;
  romLowConfidenceRejected=0;
}

function romCurrentAxis(){ return romAxes[romStep]||null; }

function romDeltaForAxis(raw,i){
  if(raw==null || !romRefPose || romRefPose[i]==null) return null;
  const c=MAP_CFG[i];
  const rawDelta=(i===0) ? V.wrap180(raw-romRefPose[i]) : (raw-romRefPose[i]);
  return rawDelta*c.dir*c.gain;
}

function romAcceptAxisSample(axis,delta,ts){
  if(!Number.isFinite(delta)) return false;
  if(axis.last!=null){
    const dt=Math.max(16,ts-axis.lastTs);
    const allowed=axis.jump*Math.max(1,Math.min(3,dt/50));
    if(Math.abs(delta-axis.last)>allowed){
      if(axis.pending!=null && ts-axis.pendingTs<250 && Math.abs(delta-axis.pending)<allowed*0.55){
        axis.pending=null;
      }else{
        axis.pending=delta;
        axis.pendingTs=ts;
        axis.rejected++;
        romRejected++;
        return false;
      }
    }else axis.pending=null;
  }
  axis.last=delta;
  axis.lastTs=ts;
  axis.current=delta;
  axis.samples.push(delta);
  axis.min=axis.min==null?delta:Math.min(axis.min,delta);
  axis.max=axis.max==null?delta:Math.max(axis.max,delta);
  return true;
}

function romBasePoseScore(raw){
  if(!raw || !romRefPose) return 0;
  let sum=0, count=0;
  for(let i=0;i<5;i++){
    if(raw[i]==null || romRefPose[i]==null) return 0;
    const d=i===0 ? Math.abs(V.wrap180(raw[i]-romRefPose[i])) : Math.abs(raw[i]-romRefPose[i]);
    sum+=Math.max(0,1-d/ROM_BASE_TOL[i]);
    count++;
  }
  return count===5?sum/count:0;
}

function romPrepareAxis(index){
  romStep=index;
  romPhase="await_base";
  romAxisStartTs=0;
  romBaseHoldStart=0;
  romBaseMatch=0;
  const axis=romCurrentAxis();
  if(!axis) return;
  axis.current=null;
  axis.last=null;
  axis.pending=null;
  $btnRom.textContent=`⏳ CH${axis.ch} 기본자세 대기`;
  setStatus(`CH${axis.ch} ${axis.name} 준비 — 등록한 로봇 기본자세로 돌아오세요. 자세가 맞으면 자동으로 측정을 시작합니다`);
}

function romBeginCurrentAxis(ts){
  const axis=romCurrentAxis();
  if(!axis) return;
  axis.samples=[];
  axis.current=axis.min=axis.max=null;
  axis.last=null; axis.lastTs=0; axis.pending=null; axis.pendingTs=0;
  axis.rejected=0; axis.lowConfidenceRejected=0;
  axis.startedAt=ts;
  axis.endedAt=null;
  axis.durationMs=0;
  axis.completed=false;
  romAxisStartTs=ts;
  romPhase="measuring";
  $btnRom.textContent=`⏹ CH${axis.ch} 측정 완료`;
  setStatus(`▶ CH${axis.ch} ${axis.name} 측정 시작 — ${axis.instruction}`);
  setTimeout(()=>{ if(romActive&&romPhase==="measuring") $status.style.opacity=0; },2600);
}

function romCollectSample(ts,arm,hand){
  if(!romActive || !lastRawAngles) return;

  if(romPhase==="await_base"){
    romBaseMatch=romBasePoseScore(lastRawAngles);
    if(romBaseMatch>=0.78){
      if(!romBaseHoldStart) romBaseHoldStart=ts;
      if(ts-romBaseHoldStart>=ROM_BASE_HOLD) romBeginCurrentAxis(ts);
    }else romBaseHoldStart=0;
    return;
  }

  if(romPhase!=="measuring") return;
  const axis=romCurrentAxis();
  if(!axis) return;
  const armOk=(arm?.trackConfidence??1)>=ROM_CONFIDENCE_MIN;
  const handOk=!!hand && (hand.confidence??1)>=ROM_CONFIDENCE_MIN;
  const qualityOk=axis.ch<=2 ? armOk : (armOk&&handOk);
  if(!qualityOk){
    axis.lowConfidenceRejected++;
    romLowConfidenceRejected++;
    return;
  }
  const delta=romDeltaForAxis(lastRawAngles[axis.ch],axis.ch);
  if(delta!=null) romAcceptAxisSample(axis,delta,ts);
}

function quantile(arr,q){
  if(!arr.length) return null;
  const sorted=[...arr].sort((a,b)=>a-b);
  const pos=(sorted.length-1)*q;
  const lo=Math.floor(pos), hi=Math.ceil(pos);
  return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(pos-lo);
}
function r1(v){ return v==null?null:Math.round(v*10)/10; }
function signed1(v){
  if(v==null) return "--";
  const n=Math.abs(v)<0.05?0:v;
  return `${n>=0?"+":""}${n.toFixed(1)}°`;
}

async function romStart(){
  if(!running){
    setStatus("먼저 ▶ 시작을 눌러 카메라를 켜세요");
    setTimeout(()=>{$status.style.opacity=0;},1800); return;
  }
  if(!refPose){
    setStatus("먼저 📍 자세 등록으로 ROBOT_START_POSE에 대응하는 사람 기본자세를 등록하세요");
    setTimeout(()=>{$status.style.opacity=0;},2600); return;
  }
  if(diagActive){
    setStatus("진단 모드를 먼저 종료하세요");
    setTimeout(()=>{$status.style.opacity=0;},1600); return;
  }
  sysState="idle";
  matchHoldStart=0;
  if(robotConnected) await disconnectRobot();

  romRefPose=[...refPose];
  romResetAxes();
  romResult=null;
  romSessionStartTs=performance.now();
  romActive=true;
  $btnRom.classList.add("on");
  romPrepareAxis(0);
}

function romFinishCurrentAxis(){
  if(!romActive || romPhase!=="measuring") return;
  const now=performance.now();
  const axis=romCurrentAxis();
  const elapsed=now-romAxisStartTs;
  if(elapsed<ROM_MIN_AXIS_DURATION){
    const remain=Math.ceil((ROM_MIN_AXIS_DURATION-elapsed)/1000);
    setStatus(`CH${axis.ch} 측정이 너무 짧습니다 — ${remain}초 더 움직이세요`);
    setTimeout(()=>{ if(romActive) $status.style.opacity=0; },1600);
    return;
  }
  axis.endedAt=now;
  axis.durationMs=Math.round(elapsed);
  axis.completed=true;
  if(romStep<ROM_CHANNELS.length-1){
    romPrepareAxis(romStep+1);
  }else{
    romComplete(now);
  }
}

function romBuildResult(endTs){
  const channels=[];
  for(const axis of romAxes){
    const i=axis.ch;
    const qMin=quantile(axis.samples,ROM_Q_LOW);
    const qMax=quantile(axis.samples,ROM_Q_HIGH);
    let safeMin=qMin==null?0:Math.min(0,qMin+axis.margin);
    let safeMax=qMax==null?0:Math.max(0,qMax-axis.margin);
    const hwMinDelta=JOINT_MIN[i]-ROBOT_START_POSE[i];
    const hwMaxDelta=JOINT_MAX[i]-ROBOT_START_POSE[i];
    safeMin=clamp(safeMin,hwMinDelta,hwMaxDelta);
    safeMax=clamp(safeMax,hwMinDelta,hwMaxDelta);
    if(safeMin>safeMax){ safeMin=0; safeMax=0; }
    const enough=axis.samples.length>=ROM_MIN_AXIS_SAMPLES && axis.durationMs>=ROM_MIN_AXIS_DURATION;
    channels.push({
      channel:`CH${i}`,
      axis:axis.key,
      name:axis.name,
      referenceFrame:i<=1?"torso transverse/forward/down axes":i===2?"upper arm and forearm included angle":"forearm-local up/down and left/right axes",
      startServoDeg:r1(ROBOT_START_POSE[i]),
      durationMs:axis.durationMs,
      sampleCount:axis.samples.length,
      rejectedJumpCount:axis.rejected,
      rejectedLowConfidenceCount:axis.lowConfidenceRejected,
      sufficientSamples:enough,
      observedDeltaDeg:{min:r1(axis.min),max:r1(axis.max)},
      robustDeltaDeg:{lowPercentile:ROM_Q_LOW,highPercentile:ROM_Q_HIGH,min:r1(qMin),max:r1(qMax)},
      recommendedDeltaDeg:{min:r1(safeMin),max:r1(safeMax)},
      recommendedServoLimitDeg:{min:r1(ROBOT_START_POSE[i]+safeMin),max:r1(ROBOT_START_POSE[i]+safeMax)},
      hardwareServoLimitDeg:{min:JOINT_MIN[i],max:JOINT_MAX[i]},
      inwardSafetyMarginDeg:axis.margin
    });
  }
  const totalDurationMs=Math.max(0,endTs-romSessionStartTs);
  const complete=channels.every(c=>c.sufficientSamples);
  const summary=[
    "Arm Vector 관절축별 최고가동범위 결과",
    `측정 순서: ${ROM_CHANNELS.map(c=>`CH${c.ch}`).join(" → ")}`,
    `기준: ROBOT_START_POSE = [${ROBOT_START_POSE.slice(0,5).join(", ")}]`,
    `전체시간: ${(totalDurationMs/1000).toFixed(1)}초 / 점프 제외: ${romRejected}개 / 저신뢰 제외: ${romLowConfidenceRejected}개`,
    ...channels.map(c=>`${c.channel} ${c.name}: 기본 ${c.startServoDeg}°, Δ ${signed1(c.recommendedDeltaDeg.min)} ~ ${signed1(c.recommendedDeltaDeg.max)} => 권장 제한 ${c.recommendedServoLimitDeg.min}° ~ ${c.recommendedServoLimitDeg.max}° (${(c.durationMs/1000).toFixed(1)}초, ${c.sampleCount}샘플${c.sufficientSamples?"":" · 부족"})`)
  ].join("\n");
  return {
    version:"v8.7.0-sequential-joint-rom",
    timestamp:new Date().toISOString(),
    purpose:"몸통 기준 어깨 좌우/상하, 기존 엘보우, 전완 기준 손목 상하/좌우를 CH0부터 CH4까지 순차 측정",
    measurementMode:"sequential_one_axis_each_from_robot_start_pose",
    channelOrder:[0,1,2,3,4],
    robotOutputDuringMeasurement:"OFF (serial disconnected and command transmission blocked)",
    everyAxisStartsFromRegisteredRobotBasePose:true,
    arm:currentArm,
    totalDurationMs:Math.round(totalDurationMs),
    minimumAxisDurationMs:ROM_MIN_AXIS_DURATION,
    complete,
    basePoseServoDeg:ROBOT_START_POSE.slice(0,5),
    humanReferenceRawDeg:romRefPose.slice(0,5).map(r1),
    mapConfig:MAP_CFG.slice(0,5),
    axisDefinitions:{
      CH0:"upper-arm left/right azimuth relative to torso transverse and forward axes; torso yaw excluded",
      CH1:"upper-arm up/down angle relative to torso down axis",
      CH2:"elbow flexion; unchanged",
      CH3:"wrist up/down bend relative to forearm axis",
      CH4:"wrist left/right bend relative to forearm axis; forearm twist excluded"
    },
    outlierFilter:{oneFrameJumpRejected:true,sustainedNewPositionResync:true,minimumTrackingConfidence:ROM_CONFIDENCE_MIN,finalPercentile:[ROM_Q_LOW,ROM_Q_HIGH],minimumAxisSamples:ROM_MIN_AXIS_SAMPLES},
    channels,
    chatSummary:summary
  };
}

function romComplete(now){
  romResult=romBuildResult(now);
  romActive=false;
  romPhase="idle";
  $btnRom.textContent="📁 측정 결과 저장";
  $btnRom.classList.add("on");
  const weak=romResult.channels.filter(c=>!c.sufficientSamples).map(c=>c.channel);
  if(weak.length) setStatus(`⚠ 순차 측정 완료 — ${weak.join(", ")} 데이터가 부족합니다. 저장 후 해당 축 재측정을 권장합니다`);
  else setStatus("✅ CH0→CH4 순차 측정 완료 — 버튼을 다시 눌러 JSON을 저장하세요");
}

function romCancel(){
  romActive=false;
  romPhase="idle";
  romResult=null;
  $btnRom.textContent="📐 최고 가동범위";
  $btnRom.classList.remove("on");
  setStatus("가동범위 측정이 중단되었습니다");
}

async function romExport(){
  if(!romResult) return;
  const blob=new Blob([JSON.stringify(romResult,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`armvec_rom_sequential_${Date.now()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  try{ await navigator.clipboard.writeText(romResult.chatSummary); }catch(e){}
  setStatus("📁 순차 측정 결과 저장됨 — JSON을 ChatGPT에게 보내세요");
  setTimeout(()=>{$status.style.opacity=0;},2600);
  $btnRom.textContent="📐 최고 가동범위";
  $btnRom.classList.remove("on");
  romResult=null;
}

function romHudBanner(ts){
  const axis=romCurrentAxis();
  if(!axis) return "";
  const done=romAxes.filter(a=>a.completed).length;
  const progress=`${done+1}/${ROM_CHANNELS.length}`;
  if(romPhase==="await_base"){
    const hold=romBaseHoldStart?Math.min(1,(ts-romBaseHoldStart)/ROM_BASE_HOLD):0;
    return `<span class="c-rom2">📐 순차 측정 [${progress}] CH${axis.ch} ${axis.name}</span>\n`+
           `<span class="c-rom">기본자세 복귀 대기 · 일치도 ${(romBaseMatch*100).toFixed(0)}% ${matchGauge(romBaseMatch)}</span>\n`+
           `<span class="dim">일치 자세를 ${(ROM_BASE_HOLD/1000).toFixed(1)}초 유지하면 자동 시작 ${matchGauge(hold)}</span>\n`+
           `<span class="dim">각 축은 ROBOT_START_POSE에서 개별 시작 · 로봇 출력 OFF</span>\n`+
           `<span class="dim">─────────────────────────</span>\n`;
  }
  const elapsed=Math.max(0,ts-romAxisStartTs);
  const ready=elapsed>=ROM_MIN_AXIS_DURATION;
  const abs=axis.current==null?null:ROBOT_START_POSE[axis.ch]+axis.current;
  return `<span class="c-rom2">📐 순차 측정 [${progress}] CH${axis.ch} ${axis.name} ${(elapsed/1000).toFixed(1)}초 ${ready?"[완료 가능]":"[최소 8초]"}</span>\n`+
         `<span class="c-rom">현재 ${signed1(axis.current)} (${abs==null?"--":abs.toFixed(1)+"°"}) · 기록 ${signed1(axis.min)} ~ ${signed1(axis.max)}</span>\n`+
         `<span class="dim">${axis.instruction}</span>\n`+
         `<span class="dim">현재 축만 기록 중 · ${axis.samples.length}샘플 · 로봇 출력 OFF</span>\n`+
         `<span class="dim">─────────────────────────</span>\n`;
}

let diagActive=false;
let diagIdx=0;
let diagCapturing=false;
let diagSamples=[];       // 현재 자세의 샘플들
let diagResults=[];       // 전체 결과
let diagCountdown=0;

function diagStart(){
  diagActive=true;
  diagIdx=0;
  diagResults=[];
  diagBeginPose();
}
function diagBeginPose(){
  diagSamples=[];
  diagCapturing=false;
  diagCountdown=0;
  const p=DIAG_POSES[diagIdx];
  setStatus(`🔬 [${diagIdx+1}/${DIAG_POSES.length}] ${p.name} — ${p.desc} · [스페이스]로 3초 캡처`);
}
function diagCaptureStart(){
  if(!diagActive || diagCapturing) return;
  diagCountdown=3;
  const p=DIAG_POSES[diagIdx];
  setStatus(`자세 유지… 3`);
  const iv=setInterval(()=>{
    diagCountdown--;
    if(diagCountdown>0){ setStatus(`자세 유지… ${diagCountdown}`); }
    else{
      clearInterval(iv);
      diagCapturing=true;
      diagSamples=[];
      setStatus(`📸 캡처 중… 자세 유지`);
      // 1초간 샘플 수집
      setTimeout(()=>{ diagFinishPose(); }, 1000);
    }
  },1000);
}
function diagCollectSample(){
  // render에서 매 프레임 호출 (캡처 중일 때만)
  if(!diagCapturing) return;
  const raw=lastRawAngles;
  const d=lastDiagData;  // render가 채워둔 상세 데이터
  if(raw && raw.some(v=>v!=null)){
    diagSamples.push({ raw:[...raw], detail:d?{...d}:null });
  }
}
function median(arr){
  if(arr.length===0) return null;
  const s=[...arr].sort((a,b)=>a-b);
  return s[Math.floor(s.length/2)];
}
function diagFinishPose(){
  diagCapturing=false;
  const p=DIAG_POSES[diagIdx];
  // 샘플들의 중앙값 (노이즈 제거)
  const measured={};
  const names=["shoulderLR","shoulderUD","elbow","wristUD","wristLR","unused"];
  for(let i=0;i<6;i++){
    const vals=diagSamples.map(s=>s.raw[i]).filter(v=>v!=null);
    measured[names[i]]=vals.length? Math.round(median(vals)*10)/10 : null;
  }
  // 상세 벡터 평균 (있으면)
  let detailAvg=null;
  const dets=diagSamples.map(s=>s.detail).filter(d=>d);
  if(dets.length){
    detailAvg={};
    for(const k of Object.keys(dets[0])){
      const vals=dets.map(d=>d[k]).filter(v=>typeof v==='number');
      if(vals.length) detailAvg[k]=Math.round(median(vals)*100)/100;
    }
  }
  diagResults.push({
    pose:p.id, name:p.name, focus:p.focus,
    expect:p.expect, measured, detail:detailAvg,
    sampleCount:diagSamples.length
  });
  // 다음 자세로
  diagIdx++;
  if(diagIdx>=DIAG_POSES.length){
    diagComplete();
  } else {
    diagBeginPose();
  }
}
function diagComplete(){
  diagActive=false;
  $btnDiag.textContent="🔬 진단 완료 (내보내기)";
  $btnDiag.classList.add("on");
  setStatus("✅ 진단 완료! 🔬 버튼 다시 눌러 결과 파일 내보내기");
}
function diagExport(){

    version:"v8.7.0-sequential-joint-rom",
    timestamp:new Date().toISOString(),
    arm:currentArm,
    poses:diagResults,
    notes:"기대(expect) vs 실측(measured) 비교. detail은 3D 벡터 원시값."
  };

// render가 매 프레임 채우는 상세 진단 데이터
let lastDiagData=null;

async function connectRobot(){
  if(!("serial" in navigator)){
    setStatus("⚠ Web Serial 미지원 — 크롬/엣지 데스크톱에서 열어야 함 (폰·파이어폭스·사파리 불가)");
    return;
  }
  try{
    // 포트 선택 (사용자가 아두이노 골라야 함)
    serialPort=await navigator.serial.requestPort();
  }catch(err){
    // 사용자가 팝업 취소했거나 포트 없음
    setStatus("포트 선택 취소됨 — 아두이노가 목록에 없으면 USB 연결/드라이버 확인");
    return;
  }
  try{
    await serialPort.open({ baudRate:115200 });
  }catch(err){
    // 이미 다른 프로그램이 포트 점유 (제일 흔한 원인)
    if(String(err).includes("locked")||String(err).includes("in use")||String(err).includes("Failed to open")){
      setStatus("⚠ 포트가 이미 사용 중 — 아두이노 IDE의 '시리얼 모니터'를 닫고 다시 시도");
    } else {
      setStatus("포트 열기 실패: "+err.message);
    }
    try{ await serialPort.close(); }catch(e){}
    serialPort=null;
    return;
  }
  try{
    serialWriter=serialPort.writable.getWriter();
    robotConnected=true;
    $btnRobot.textContent="🤖 로봇 연결됨";
    $btnRobot.classList.add("on");
    setStatus("로봇 연결됨 — 통신 확인 중…");

    // 아두이노 응답 읽기 (READY/CENTERED 확인) — 백그라운드
    startSerialReader();

    // 연결 시 펌웨어의 START_COMMAND로 이동. CH5는 계속 PWM OFF.
    await new Promise(r=>setTimeout(r,1800)); // Arduino Uno 자동 리셋/부트로더 대기
    await sendRaw("C\n");

    setTimeout(()=>{
      setStatus("✅ 로봇 준비 완료 — 시작 자세 [10, 1, 95, 137.5, 94]로 정렬됨. 자세 등록 후 엔터로 시동");
      setTimeout(()=>{$status.style.opacity=0;},1800);
    },600);
  }catch(err){
    setStatus("Writer 생성 실패: "+err.message);
    robotConnected=false;
  }
}

// 아두이노 → 브라우저 응답 읽기 (연결 확인용)
let serialReader=null, readerActive=false;
async function startSerialReader(){
  if(!serialPort||!serialPort.readable) return;
  readerActive=true;
  try{
    serialReader=serialPort.readable.getReader();
    const decoder=new TextDecoder();
    let lineBuf="";
    while(readerActive){
      const {value,done}=await serialReader.read();
      if(done) break;
      lineBuf+=decoder.decode(value,{stream:true});
      let nl;
      while((nl=lineBuf.indexOf("\n"))>=0){
        const msg=lineBuf.slice(0,nl).trim();
        lineBuf=lineBuf.slice(nl+1);
        if(msg) handleArduinoMsg(msg);
      }
    }
  }catch(err){
    // 읽기 중단 (연결 해제 등) — 무시
  }finally{
    try{ serialReader && serialReader.releaseLock(); }catch(e){}
    serialReader=null;
  }
}
let arduinoAlive=false;
function handleArduinoMsg(msg){
  // READY / CENTERING / CENTERED / OK / ERR
  if(msg==="READY"||msg==="CENTERED"||msg==="OK"){
    arduinoAlive=true;  // 아두이노가 살아서 응답 = 통신 정상
  }
}

// 저수준 전송 (문자열 그대로)
async function sendRaw(str){
  if(!serialWriter) return;
  try{ await serialWriter.write(new TextEncoder().encode(str)); }catch(e){}
}

async function disconnectRobot(){
  robotConnected=false;
  readerActive=false;
  arduinoAlive=false;
  try{
    if(serialReader){ await serialReader.cancel(); serialReader.releaseLock(); serialReader=null; }
  }catch(e){}
  try{
    if(serialWriter){ serialWriter.releaseLock(); serialWriter=null; }
    if(serialPort){ await serialPort.close(); serialPort=null; }
  }catch(e){}
  $btnRobot.textContent="🤖 로봇 연결";
  $btnRobot.classList.remove("on");
}

async function sendToRobot(servos){
  if(!robotConnected||!serialWriter) return;
  const now=performance.now();
  if(now-lastRobotSend<ROBOT_INTERVAL) return;
  lastRobotSend=now;
  // "a0,a1,a2,a3,a4,a5\n" — 0.5° 시작값 보존을 위해 소수 1자리 전송
  const line=servos.map(a=>Number(a).toFixed(1)).join(",")+"\n";
  try{
    await serialWriter.write(new TextEncoder().encode(line));
  }catch(err){
    setStatus("전송 끊김: "+err.message);
    robotConnected=false;
  }
}

  $status.style.opacity=1;
  $status.textContent=msg;
}

};

// ── 진단 모드 버튼 ──
$btnDiag.onclick=()=>{
  if(romActive){
    setStatus("최고 가동범위 측정을 먼저 종료하세요");
    setTimeout(()=>{$status.style.opacity=0;},1700); return;
  }
  if(!running){
    setStatus("먼저 ▶ 시작을 눌러 카메라를 켜세요");
    setTimeout(()=>{$status.style.opacity=0;},1800); return;
  }
  if(diagResults.length>0 && !diagActive){

    $btnDiag.classList.remove("on");

    return;

    $btnDiag.classList.remove("on");

    setTimeout(()=>{$status.style.opacity=0;},1500);

  }

  $btnDiag.textContent="🔬 진단 중 (중단하려면 클릭)";

// ── 최고 가동범위 측정 버튼 ──
$btnRom.onclick=async()=>{
  if(romResult && !romActive){ await romExport(); return; }
  if(romActive){
    if(romPhase==="measuring") romFinishCurrentAxis();
    else romCancel();

  }

// ── 시동 자세: 카운트다운 후 현재 팔 각도를 0점으로 저장 ──
// ══ 기준 자세 등록 (btnCalib 재활용) ══
let calibTimer=null;
$btnCalib.onclick=()=>{
  if(romActive){
    setStatus("측정 중에는 기준 자세를 다시 등록할 수 없습니다");
    setTimeout(()=>{$status.style.opacity=0;},1700); return;
  }
  if(calibTimer){ return; }
  // 3초 카운트다운 후 현재 자세를 '기준 자세'로 등록 (localStorage 저장)
  let cnt=3;
  setStatus(`기준 자세를 취하세요 — ${cnt}초 후 등록 (매번 이 자세로 시동함)`);
  calibTimer=setInterval(()=>{
    cnt--;
    if(cnt>0){ setStatus(`기준 자세 유지… ${cnt}`); }
    else{
      clearInterval(calibTimer); calibTimer=null;
      const r=lastRawAngles;
      if(!r || r.every(v=>v==null)){
        setStatus("팔이 안 잡혀 — 상체가 다 보이게 하고 다시"); 
        setTimeout(()=>{$status.style.opacity=0;},1800); return;
      }
      refPose=r.map((v,i)=> v!=null ? v : rawDefaultRef[i]);
      calibRef=null;
      sysState='idle';
      matchHoldStart=0;
      try{ localStorage.setItem(REFPOSE_STORAGE_KEY, JSON.stringify(refPose)); }catch(e){}
      $btnCalib.textContent="📍 자세 등록됨";
      $btnCalib.classList.add("on");
      setStatus("✅ 기준 자세 등록 완료 — 이제 시동 트리거(엔터/박수2) 후 이 자세 취하면 시동");
      setTimeout(()=>{$status.style.opacity=0;},2500);
    }
  },1000);
};

// ── 시동 트리거: idle → arming ──
function armSystem(){
  if(romActive){
    setStatus("관절축 순차 가동범위 측정 중에는 로봇을 시동할 수 없습니다");
    setTimeout(()=>{$status.style.opacity=0;},1800); return;
  }
  if(!refPose){
    setStatus("먼저 '기준 자세'를 등록하세요 (📍 버튼)");
    setTimeout(()=>{$status.style.opacity=0;},2000); return;
  }
  if(!robotConnected){
    setStatus("먼저 로봇을 연결하세요 (🤖 버튼)");
    setTimeout(()=>{$status.style.opacity=0;},2000); return;
  }
  sysState='arming';
  matchHoldStart=0;
  setStatus("🎯 시동 준비 — 로봇이 [10, 1, 95, 137.5, 94] 자세로 이동합니다. 등록한 사람 자세를 취하면 시동됩니다");
}
// ── 대기 트리거: active/arming → idle ──
function disarmSystem(){
  sysState='idle';
  matchHoldStart=0;
  setStatus("⏸ 대기 상태 — 로봇 정지. 다시 시동하려면 트리거(엔터/박수2)");
  setTimeout(()=>{$status.style.opacity=0;},1800);
}
// 상태 토글 (시동 트리거 키/박수가 부름)
function toggleArm(){
  if(sysState==='idle') armSystem();
  else disarmSystem();  // arming이나 active면 대기로
}

$btnLock.onclick=()=>{
  if(personLocked){
    // 락 해제
    personLocked=false;
    lockSig=null;
    lockLostFrames=0;
    $btnLock.textContent="🔒 인물 고정";
    $btnLock.classList.remove("on");
    setStatus("인물 고정 해제 — 가장 가까운 사람 자동 추적");
    setTimeout(()=>{$status.style.opacity=0;},1200);
  } else {
    // 지금 추적 중인 사람을 락. 현재 프레임에서 지문 추출
    if(!lastPose||!lastPose.landmarks||lastPose.landmarks.length===0){
      setStatus("고정할 사람이 없어 — 먼저 화면에 들어와");
      setTimeout(()=>{$status.style.opacity=0;},1500);
      return;
    }
    // 락 걸기 직전엔 아직 personLocked=false라 choosePersonIndex가 '제일 가까운 사람' 반환
    const idx=choosePersonIndex(lastPose);
    if(idx<0){ setStatus("사람 인식 실패 — 다시 시도"); return; }
    const sig=personSignature(lastPose.landmarks[idx]);
    if(!sig){ setStatus("어깨가 안 보여 — 상체가 다 나오게"); return; }
    lockSig={...sig};
    personLocked=true;
    lockLostFrames=0;
    $btnLock.textContent="🔓 고정 중";
    $btnLock.classList.add("on");
    setStatus("이 사람에게 고정됨 — 타인이 들어와도 유지");
    setTimeout(()=>{$status.style.opacity=0;},1500);
  }
};

if(!window.isSecureContext){
  $status.textContent=`⚠ 이 주소(${location.protocol})에선 카메라 API가 잠겨 있어. HTTPS 또는 localhost로 열어야 함.`;
}
let resizeTimer=null;
window.addEventListener("resize",()=>{
  if(!running) return;
  clearTimeout(resizeTimer); resizeTimer=setTimeout(resizeCanvases,150);
});

// 키보드 단축키: Space=시작/진단캡처, G=가동범위 단계완료, L=인물고정, M=반전, A=팔전환, Q=모델, R=자세등록
window.addEventListener("keydown",(e)=>{
  if(e.repeat) return;
  const k=e.key.toLowerCase();
  if(k===" "){
    e.preventDefault();
    if(diagActive){ diagCaptureStart(); }         // 진단 중이면 캡처
    else if(!$btnStart.disabled){ $btnStart.click(); }  // 아니면 시작
  }
  else if(k==="l") $btnLock.click();
  else if(k==="m") $btnMirror.click();
  else if(k==="a") $btnArm.click();
  else if(k==="q") $btnQuality.click();
  else if(k==="r") $btnCalib.click();  // R = 기준자세 등록(Register)
  else if(k==="g") $btnRom.click();      // G = 최고 가동범위 측정
  else if(k==="enter"){ e.preventDefault(); toggleArm(); }  // 엔터 = 시동/대기
  else if(k==="s" && diagActive){ diagSkip(); }  // 진단 중 S = 이 자세 건너뛰기
});
// 진단 자세 건너뛰기
function diagSkip(){
  if(!diagActive || diagCapturing) return;
  diagResults.push({ pose:DIAG_POSES[diagIdx].id, name:DIAG_POSES[diagIdx].name,
                     skipped:true });
  diagIdx++;
  if(diagIdx>=DIAG_POSES.length) diagComplete();
  else diagBeginPose();
}
